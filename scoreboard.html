<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Cricket Stream Canvas</title>
    <style>
        body {
            margin: 0;
            width: 1920px;
            height: 1080px;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 60px;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px 40px;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .match-title { font-size: 32px; font-weight: 700; color: #38bdf8; }
        .score-box {
            display: flex;
            flex-direction: column;
            gap: 20px;
            justify-content: center;
            background: rgba(15, 23, 42, 0.85);
            padding: 50px 60px;
            border-radius: 24px;
            border: 2px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .teams { font-size: 38px; font-weight: 700; color: #94a3b8; }
        .runs { font-size: 64px; font-weight: 900; color: #4ade80; line-height: 1.2; }
        .commentary-box {
            background: rgba(0, 0, 0, 0.65);
            padding: 35px 45px;
            border-radius: 16px;
            border-left: 8px solid #38bdf8;
            font-size: 32px;
            line-height: 1.5;
            min-height: 120px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="match-title" id="matchTitle">CricRover • Live Cricket Broadcast</div>
        <div id="status" style="font-size: 26px; font-weight: bold; color: #4ade80;">● LIVE STREAM</div>
    </div>
    <div class="score-box">
        <div class="teams" id="overs">Live Feed Active</div>
        <div class="runs" id="score">Fetching Live Match Score...</div>
    </div>
    <div class="commentary-box" id="commentary">
        Connecting to live AI commentary studio...
    </div>

    <script>
        async function updateDisplay() {
            try {
                const res = await fetch('./obs_state.json?' + new Date().getTime());
                const data = await res.json();
                if (data.score) document.getElementById('score').innerText = data.score;
                if (data.overs) document.getElementById('overs').innerText = data.overs;
                if (data.commentary) document.getElementById('commentary').innerText = data.commentary;
            } catch (e) {
                console.log("Waiting for state file...");
            }
        }
        setInterval(updateDisplay, 2000);
        updateDisplay();
    </script>
</body>
</html>
