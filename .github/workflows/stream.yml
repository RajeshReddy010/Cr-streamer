name: Automated YouTube Live Stream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Chrome, FFmpeg & PulseAudio
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg pulseaudio pulseaudio-utils alsa-utils libasound2-dev wget
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -fy
          rm google-chrome-stable_current_amd64.deb

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai edge-tts aiohttp pydantic beautifulsoup4 requests

      - name: Run Display, Audio, AI Commentator & YouTube Stream
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          # 1. Start Virtual Display
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          sleep 2

          # 2. Start PulseAudio & Virtual Speaker in the SAME session
          pulseaudio -D --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=virtual_speaker sink_properties=device.description="Virtual_Speaker"
          pactl set-default-sink virtual_speaker
          export PULSE_SINK=virtual_speaker

          # 3. Start Local Web Server
          echo '{"teams": "Live Match", "score": "Loading Live Score...", "overs": "Live Action", "commentary": "Connecting live voiceover commentary..."}' > obs_state.json
          python3 -m http.server 8080 &
          sleep 2

          # 4. Launch Headless Chrome
          google-chrome --display=:99 \
            --no-sandbox \
            --disable-gpu \
            --no-first-run \
            --no-default-browser-check \
            --disable-fre \
            --disable-infobars \
            --window-position=0,0 \
            --window-size=1920,1080 \
            --kiosk \
            --app=http://localhost:8080/scoreboard.html &
          sleep 4

          # 5. Start AI Commentator Loop (Unbuffered so you see logs in GitHub!)
          python3 -u ai_commentator.py &
          sleep 5

          # 6. Stream Video + Virtual Speaker Audio to YouTube
          ffmpeg -f x11grab -video_size 1920x1080 -framerate 30 -i :99.0 \
            -f pulse -i virtual_speaker.monitor \
            -c:v libx264 -preset veryfast -b:v 4500k -minrate 4500k -maxrate 4500k -bufsize 9000k \
            -pix_fmt yuv420p -g 60 \
            -c:a aac -b:a 128k -ar 44100 \
            -f flv rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY
