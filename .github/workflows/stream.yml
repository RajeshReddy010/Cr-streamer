name: Automated YouTube Live Stream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Chrome & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg wget
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -fy
          rm google-chrome-stable_current_amd64.deb

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests

      - name: Build Stadium Crowd Atmosphere MP3
        run: |
          mkdir -p audio_assets
          wget -q -O audio_assets/crowd1.ogg "https://actions.google.com/sounds/v1/crowds/battle_crowd_celebration.ogg" || true
          wget -q -O audio_assets/crowd2.ogg "https://actions.google.com/sounds/v1/crowds/team_cheer.ogg" || true

          if [ -s audio_assets/crowd1.ogg ]; then
            ffmpeg -y -stream_loop -1 -i audio_assets/crowd1.ogg \
              -f lavfi -i "anoisesrc=c=brown:r=44100:a=0.05,lowpass=f=420,highpass=f=80" \
              -filter_complex "[0:a]volume=0.40[c];[1:a]volume=0.60[n];[c][n]amix=inputs=2:duration=shortest" \
              -t 45 -ar 44100 -ac 2 -c:a libmp3lame -b:a 128k audio_assets/master_bg_loop.mp3
          else
            ffmpeg -y -f lavfi -i "anoisesrc=c=pink:r=44100:a=0.08,bandpass=f=350:width_type=h:w=250,tremolo=f=0.4:d=0.35" \
              -t 45 -ar 44100 -ac 2 -c:a libmp3lame -b:a 128k audio_assets/master_bg_loop.mp3
          fi

      - name: Run Display, Live Scraper & Synchronized YouTube Stream
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          # 1. Start Virtual Display (1280x720 HD)
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          sleep 2

          # 2. Start Local Web Server
          python3 -m http.server 8080 &
          sleep 2

          # 3. Start Live Cricket Scraper First so obs_state.json is ready
          python3 -u ai_commentator.py &
          sleep 4

          # 4. Launch Headless Chrome scaled cleanly to 1280x720
          google-chrome --display=:99 \
            --no-sandbox \
            --disable-gpu \
            --disable-software-rasterizer \
            --disable-dev-shm-usage \
            --no-first-run \
            --no-default-browser-check \
            --disable-fre \
            --disable-infobars \
            --force-device-scale-factor=0.6666 \
            --window-position=0,0 \
            --window-size=1920,1080 \
            --kiosk \
            --app=http://localhost:8080/scoreboard.html &
          sleep 4

          # 5. Single Synchronized FFmpeg Stream (Video + Looped Stadium Crowd MP3)
          ffmpeg -f x11grab -video_size 1280x720 -framerate 24 -draw_mouse 0 -i :99.0 \
            -stream_loop -1 -i audio_assets/master_bg_loop.mp3 \
            -map 0:v:0 -map 1:a:0 \
            -c:v libx264 -preset ultrafast -tune zerolatency \
            -b:v 3000k -minrate 3000k -maxrate 3000k -bufsize 6000k \
            -pix_fmt yuv420p -r 24 -g 48 -keyint_min 48 -sc_threshold 0 \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -f flv rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY
