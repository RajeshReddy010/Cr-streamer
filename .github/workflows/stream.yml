name: Automated YouTube Live Stream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Chrome & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg wget
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -fy
          rm google-chrome-stable_current_amd64.deb

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests

      - name: Build Stadium Crowd Atmosphere MP3
        run: |
          mkdir -p audio_assets
          wget -q -O audio_assets/crowd1.ogg "https://actions.google.com/sounds/v1/crowds/battle_crowd_celebration.ogg" || true
          ffmpeg -y -stream_loop -1 -i audio_assets/crowd1.ogg -f lavfi -i "anoisesrc=c=brown:r=44100:a=0.05" -filter_complex "[0:a]volume=0.4[c];[1:a]volume=0.6[n];[c][n]amix=inputs=2:duration=shortest" -t 45 -ar 44100 -ac 2 -c:a libmp3lame -b:a 128k audio_assets/master_bg_loop.mp3 || ffmpeg -y -f lavfi -i "anoisesrc=c=pink:r=44100:a=0.08" -t 45 -ar 44100 -ac 2 -c:a libmp3lame -b:a 128k audio_assets/master_bg_loop.mp3

      - name: Run Display, Live Scraper & 1080p Stream
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          # 1. Start Virtual Display at Crystal Clear Native 1920x1080
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          sleep 2

          # 2. Start Local Web Server
          python3 -m http.server 8080 &
          sleep 2

          # 3. Start Live Cricket Scraper
          python3 -u ai_commentator.py &
          sleep 4

          # 4. Launch Headless Chrome at 1920x1080 (Zero Blur)
          google-chrome --display=:99 \
            --no-sandbox \
            --disable-gpu \
            --disable-software-rasterizer \
            --disable-dev-shm-usage \
            --no-first-run \
            --no-default-browser-check \
            --disable-fre \
            --disable-infobars \
            --window-position=0,0 \
            --window-size=1920,1080 \
            --kiosk \
            --app=http://localhost:8080/scoreboard.html &
          sleep 4

          # 5. Crisp 1080p FFmpeg Stream + Stadium Crowd BGM
          ffmpeg -f x11grab -video_size 1920x1080 -framerate 30 -draw_mouse 0 -i :99.0 \
            -stream_loop -1 -i audio_assets/master_bg_loop.mp3 \
            -map 0:v:0 -map 1:a:0 \
            -c:v libx264 -preset ultrafast -tune zerolatency \
            -b:v 4500k -minrate 4500k -maxrate 4500k -bufsize 9000k \
            -pix_fmt yuv420p -r 30 -g 30 -keyint_min 30 -sc_threshold 0 \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -f flv rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY
